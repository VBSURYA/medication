<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="bellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#042f2e" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base background (curved square with generous padding for safe zone) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#5eead4" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Main Card Shape in Safe Zone -->
  <g filter="url(#shadow)">
    <!-- White Shield / Medical Base -->
    <rect x="96" y="96" width="320" height="320" rx="56" fill="#ffffff"/>
    
    <!-- Medical Cross Center -->
    <rect x="232" y="156" width="48" height="200" rx="16" fill="#0d9488"/>
    <rect x="156" y="232" width="200" height="48" rx="16" fill="#0d9488"/>
    <circle cx="256" cy="256" r="28" fill="#14b8a6"/>
    
    <!-- Pill Symbol Diagonal Overlay -->
    <g transform="rotate(-35 256 256)">
      <!-- Left Pill Half (Cyan) -->
      <path d="M 176 226 A 30 30 0 0 1 256 226 L 256 286 L 176 286 Z" fill="url(#pillGrad1)"/>
      <!-- Right Pill Half (White / Light) -->
      <path d="M 336 286 A 30 30 0 0 1 256 286 L 256 226 L 336 226 Z" fill="url(#pillGrad2)"/>
      <line x1="256" y1="226" x2="256" y2="286" stroke="#0369a1" stroke-width="3"/>
    </g>

    <!-- Bell / Alarm Badge in upper corner -->
    <g transform="translate(320, 80)">
      <circle cx="36" cy="36" r="36" fill="url(#bellGrad)" stroke="#ffffff" stroke-width="6"/>
      <!-- Bell icon path -->
      <path d="M 36 20 C 31 20 27 24 27 29 C 27 38 22 42 22 44 L 50 44 C 50 42 45 38 45 29 C 45 24 41 20 36 20 Z" fill="#78350f"/>
      <path d="M 32 47 C 32 49.2 33.8 51 36 51 C 38.2 51 40 49.2 40 47 Z" fill="#78350f"/>
      <!-- Sound pulse waves -->
      <path d="M 52 28 C 55 31 55 37 52 40" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 20 28 C 17 31 17 37 20 40" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
